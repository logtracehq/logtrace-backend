receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "bundler"
          scrape_interval: 10s
          static_configs:
            - targets: ["host.docker.internal:4337"]
          basic_auth:
            username: logtrace
            password: logtrace-123444
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
