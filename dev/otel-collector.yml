receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "logtrace-backend"
          scrape_interval: 15s
          scheme: https
          metrics_path: /prometheus/metrics
          static_configs:
            - targets: ["api.logtracehq.com"]
          basic_auth:
            username: ${env:LOGTRACE_HTTP_METRICS_USERNAME}
            password: ${env:LOGTRACE_HTTP_METRICS_PASSWORD}
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
